<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CONNECTA | Monitore</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .connecta-loading{width:min(92%,520px);text-align:center;padding:36px 24px;margin:auto}
    .connecta-loading img{display:block;width:min(100%,430px);height:auto;margin:0 auto 18px}
    .connecta-loading p{margin:0;color:#52627a;font-size:14px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="connecta-loading">
    <img src="assets/img/connecta-logo.png" alt="CONNECTA by MONITORE">
    <p>Inteligência que conecta talentos e oportunidades.</p>
  </main>
  <script src="assets/js/supabase.js"></script>
  <script>
    (async function(){
      try{
        const {data:{session}} = await supabaseClient.auth.getSession();
        if(!session){ window.location.href="auth/login.html"; return; }

        const {data:usuario,error} = await supabaseClient
          .from("usuarios")
          .select("tipo")
          .eq("auth_user_id",session.user.id)
          .single();

        if(error || !usuario){ window.location.href="auth/login.html"; return; }
        if(usuario.tipo==="candidato"){ window.location.href="candidato/perfil.html"; return; }
        if(usuario.tipo==="empresa"){ window.location.href="empresa/dashboard.html"; return; }
        window.location.href="auth/login.html";
      }catch(e){
        console.error("Erro ao iniciar o CONNECTA:",e);
        window.location.href="auth/login.html";
      }
    })();
  </script>
</body>
</html>
